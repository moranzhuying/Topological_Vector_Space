# symbols.py 配置
# 每行格式：键 = 值  以 # 或 ; 开头的行是注释
# 命令行参数优先于本文件；本文件含本机路径，已加入 .gitignore，不上传

# 笔记根目录：其下每个含 structure.sty 的子目录都被视为一本笔记
root = D:\电子笔记

# 符号来源（模板的 structure.sty）：刷新补全与回填均以它为基准
template = D:\Note\LaTeX模板\笔记写作\structure.sty

# TeXStudio 补全文件（支持 %APPDATA% 等环境变量；留空则用默认位置）
cwl = %APPDATA%\texstudio\completion\user\custom.cwl
